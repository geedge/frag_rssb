#--------------------------------------------------------------------NETWORK
[NETWORK]
LocalIP=ens33
FwdIP=ens33

#recv bizman param, recv data from sapp
BizmanAckSmoothTime = 10
BizmanAckAccumulateTime=10
BizmanAckAccumulateNum=5
BizmanPort=22082

#sapp recv resp msg port
BizmanAckPort=22084

#msg port:recv msg
CPZMsgPort=22080
QDMsgPort=22080

#udp socket:send frag
UdpSendSwitch=1
UdpSendIP=127.0.0.1;127.0.0.1;
UdpSendIPNum=2
UdpSendPort=33082;33083

#--------------------------------------------------------------------SYSTEM
[SYSTEM]
#cpz类型 0:AV_PIC 1:voip
CPZTpye=0

ThreadNum=1
BizmanQueueMode=0
BizmanQueueMaxnum=2000000

AsmisSwitch=0

#向前端发送节目确认
AckSwitch=0

#IVI去重开关
IVISwitch=1

#index第二次反查时间
IndexQueryTime=10
#索引查询定时器回调的最大次数
IndexQueryTimerCbMaxNum=500

#media renew time
RenewTimeMax=7200
RenewTimeMin=600
RenewTimeStep=6

#节目HASH表
MediaHashSize=65536
MediaHashElemNum=1048576
MediaHashExpireTime=300

#元信息选项capIP是否修改 1：改为本地capIP, 0:选项为前端机CapIP
ModifyCapIPSwitch=1

#==============================================================VOIP
[VOIP]
VOIPFilterSwitch=0

#VOIP survey log 监测日志
VOIPSurveyLogIP=
VOIPSurveyLogIPNum=
VOIPSurveyLogPort=

#VOIP total log 全量日志
VOIPFullLogIP=
VOIPFullLogIPNum=
VOIPFullLogPort=

#voip log
VOIPLogLevel= 20
VOIPLogPath= ./log/voip.log

#--------------------------------------------------------------------LOG
[LOG]
AppName=rssb
StatRemoteSwitch=
StatServerIP=
StatServerPort=

#field_stat
StatCycle=30
StatFile=./log/rssb_stat.log

SysinfoCycle=30
SysinfoFile=./log/rssb_sysinfo.log

#log in general
LogLevel= 30
LogPath= ./log/runtime.log

#frag msg log
FragLogLevel= 30
FragLogPath= ./log/frag.log

#resp msg log
RespLogPath= ./log/survey.log

#media create log
MediaCreateLogPath= ./log/media_create.log

#media expire log
MediaExpireLogPath= ./log/media_expire.log

#--------------------------------------------------------------------DEBUG
[DEBUG]
/*节目进行本地存储*/
FileStoreSwitch=0
FileStorePath=./log/file/

#1: (reoffset-1)*content-length  0: accoffset
HlsAboffsetInMode=1

/*碎片建议无效标志*/
FragSurveyInvalid=0

/*JSON文件写本地*/
JSONLocalSwitch=0

[WLB]
wlb_on=0
wlb_topic=AV
wlb_group_name=xx
user_tag=xx
health_check_port=52100
health_check_interval=10
data_port=30000
capacity=32
cost=32
wlb_report_interval=10

bfd_recv_port=0
